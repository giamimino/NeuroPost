name: Auto create PR from issue assignment

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  cancel-in-progress: true
  group: auto-create-pr-${{ github.ref }}

jobs:
  assign-me:
    if: contains(github.event.comment.body, 'assign me')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue data
        id: issue
        run: |
          echo "title=${{ github.event.issue.title }}" >> $GITHUB_OUTPUT
          echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT

      - name: Extract users
        id: users
        run: |
          USERS=$(echo "${{ github.event.comment.body }}" | grep -o '@[a-zA-Z0-9_-]*' | tr '\n' ' ')

          echo "users=$USERS" >> $GITHUB_OUTPUT

      - name: Check self assignment
        run: |
          COMMENT="${{ github.event.comment.body }}"
          USER="@${{ github.event.comment.user.login }}"

          if [[ "$COMMENT" != *"$USER" ]]; then
            echo "User must mention themselves"
            exit 1
          fi

      - name: Create branch name
        id: branch
        run: |
          TITLE="${{ github.event.issue.title }}"

          SLUG=$(echo "$TITLE" \
          | tr '[:upper:]' '[:lower:]' \
          | sed 's/[^a-z0-9]/-/g')

          BRANCH="issue-${{ github.event.issue.number }}-$SLUG"

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Create branch
        run: |
          SHA=$(gh api repos/${{ github.repository }}/git/ref/heads/main \
          --jq '.object.sha')

          gh api \
          --method POST \
          repos/${{ github.repository }}/git/refs \
          -f ref="refs/heads/${{ steps.branch.outputs.branch }}" \
          -f sha="$SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Create initial commit
        run: |
          git checkout -b "${{ steps.branch.outputs.branch }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "# Issue #${{ github.event.issue.number }}" > ISSUE.md

          git add ISSUE.md

          git commit -m "Initialize issue branch"

          git push origin "${{ steps.branch.outputs.branch }}"
  
      - name: Create pull request
        id: pr
        run: |

          PR=$(gh pr create \
          --title "${{ github.event.issue.title }}" \
          --body "Created automatically from issue #${{ github.event.issue.number }}" \
          --base main \
          --head "${{ steps.branch.outputs.branch }}")

          echo "$PR"

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign users
        run: |
          USERS_JSON=$(echo "${{ steps.users.outputs.users }}" \
            | sed 's/@//g' \
            | awk '{print "[\"" $1 "\""} {for (i=2; i<=NF; i++) printf ",\"" $i "\""} END {print "]"}')

          gh api \
            --method POST \
            repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/assignees \
            -f "assignees=$USERS_JSON"

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on issue
        run: |
          gh issue comment \
            ${{ github.event.issue.number }} \
            --body "## ✅ Assignment completed successfully

            **Branch:** \`${{ steps.branch.outputs.branch }}\`

            The development branch has been created and is ready to use."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update issue labels
        run: |
          gh issue edit "${{ github.event.issue.number }}" --add-label "pending"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  close-issue-resources:
    if: contains(github.event.comment.body, '.close')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get issue and connected PR data
        id: issue_data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "title=${{ github.event.issue.title }}"
          echo "number=${{ github.event.issue.number }}"
          
          QUERY='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                issue(number: $number) {
                  timelineItems(first: 30, itemTypes: [CROSS_REFERENCED_EVENT]) {
                    nodes {
                      ... on CrossReferencedEvent {
                        source {
                          ... on PullRequest {
                            number
                            headRefName
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          '
          
          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          NAME=$(echo "$REPO" | cut -d'/' -f2)

          RESPONSE=$(gh api graphql -F owner="$OWNER" -F name="$NAME" -F number=$ISSUE_NUMBER -f query="$QUERY")

          PR_NUMBER=$(echo "$RESPONSE" | jq -r '.data.repository.issue.timelineItems.nodes[].source | select(.number != null) | .number' | head -n 1)
          HEAD_BRANCH=$(echo "$RESPONSE" | jq -r '.data.repository.issue.timelineItems.nodes[].source | select(.headRefName != null) | .headRefName' | head -n 1)

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No connected Pull Request found."
            echo "pr_found=false" >> $GITHUB_OUTPUT
          else
            echo "Found connected PR #$PR_NUMBER on branch $HEAD_BRANCH"
            echo "pr_found=true" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "head_branch=$HEAD_BRANCH" >> $GITHUB_OUTPUT
          fi

      - name: Close Pull Request and delete feature branch
        if: steps.issue_data.outputs.pr_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.issue_data.outputs.pr_number }}
          HEAD_BRANCH: ${{ steps.issue_data.outputs.head_branch }}
        run: |
          PR_STATE=$(gh pr view "$PR_NUMBER" \
            --json state \
            --jq '.state')

          echo "Pull Request #$PR_NUMBER state: $PR_STATE"

          if [ "$PR_STATE" = "OPEN" ]; then
            echo "Closing Pull Request #$PR_NUMBER..."
            gh pr close "$PR_NUMBER" \
              --comment "Closing pull request because the linked issue was commanded to close."
          else
            echo "Pull Request #$PR_NUMBER is already $PR_STATE. Skipping close."
          fi

          if [[ "$HEAD_BRANCH" != "main" && "$HEAD_BRANCH" != "master" && -n "$HEAD_BRANCH" ]]; then
            echo "Deleting branch $HEAD_BRANCH..."

            if gh api "repos/${{ github.repository }}/git/ref/heads/$HEAD_BRANCH" >/dev/null 2>&1; then
              gh api \
                --method DELETE \
                "repos/${{ github.repository }}/git/refs/heads/$HEAD_BRANCH"

              echo "Branch deleted."
            else
              echo "Branch already deleted."
            fi
          fi

      - name: Close Issue and Clean Labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          ISSUE_STATE=$(gh issue view "$ISSUE_NUMBER" \
            --json state \
            --jq '.state')

          echo "Issue #$ISSUE_NUMBER state: $ISSUE_STATE"

          gh issue edit "$ISSUE_NUMBER" \
            --remove-label "pending" || true

          if [ "$ISSUE_STATE" = "OPEN" ]; then
            echo "Closing issue #$ISSUE_NUMBER..."
            gh issue close "$ISSUE_NUMBER" --reason "completed"
          else
            echo "Issue #$ISSUE_NUMBER is already closed. Skipping close."
          fi