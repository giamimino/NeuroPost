name: Sync Issue Labels to PR

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write
  issues: read

concurrency:
  cancel-in-progress: true
  group: sync-issue-labels-${{ github.ref }}

jobs:
  copy-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Copy issue labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request
            const body = pr.body || "";

            const match = body.match(/#(\d+)/);

            if (!match) {
              core.info("No linked issue found");
              return;
            }

            const issue_number = match[1]

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
            });

            const labels = issue.labels.filter(label => label.name !== "pending").map(label => label.name);

            if (labels.length === 0) {
              core.info("Issue has no labels");
              return;
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              labels,
            });

            core.info(`Copied labels: ${labels.join(", ")}`);
